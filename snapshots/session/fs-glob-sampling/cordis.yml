# Minimal live counterpart for the glob-sampling snapshot composition.
- id: llm-deepseek
  name: '@eco-agent/dsh-llm-deepseek-api-key'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@eco-agent/dsh-subprocess-local'

- id: agent-default-model
  name: '@eco-agent/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@eco-agent/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@eco-agent/dsh-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@eco-agent/dsh-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@eco-agent/dsh-tool-jobs'
  disabled: true

- id: goal
  name: '@eco-agent/dsh-goal'
  disabled: true

- id: goal-round-driver
  name: '@eco-agent/dsh-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@eco-agent/dsh-command-goal'
  disabled: true

- id: tool-goal
  name: '@eco-agent/dsh-tool-goal'
  disabled: true

- id: skill
  name: '@eco-agent/dsh-skill'
  disabled: true

- id: skill-filesystem
  name: '@eco-agent/dsh-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@eco-agent/dsh-tool-skill'
  disabled: true

- id: tool-fs-search
  name: '@eco-agent/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4

- id: spill-local
  name: '@eco-agent/dsh-spill-local'
  config:
    root: !!js process.env.DSH_SNAPSHOT_SPILL_ROOT ?? './.spill'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.DSH_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.DSH_SNAPSHOT_SPILL_LOCATOR_ROOT
