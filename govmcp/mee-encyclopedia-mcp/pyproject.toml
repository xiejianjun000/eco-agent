[project]
name = "mee-encyclopedia-mcp"
version = "1.0.0"
description = "生态环境部网站矩阵百科全书 MCP Server（生产版：46 工具，覆盖主站 60+ 栏目、环境质量报告、互动交流、核安全局子站等）"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "aiofiles>=24.1.0",
]

[project.scripts]
mee-encyclopedia-mcp = "mee_encyclopedia.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
