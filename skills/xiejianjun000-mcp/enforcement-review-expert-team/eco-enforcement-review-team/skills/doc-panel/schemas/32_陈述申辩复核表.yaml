id: "32"
name: "陈述申辩复核表"
category: "行政处罚-告知和听证"
complexity: "low"
template: "32_陈述申辩复核表.md"
description: "生态环境主管部门对当事人陈述申辩意见进行复核的内部文书"

fields:
  - id: "部门名称"
    key: "{{部门名称}}"
    type: "string"
    source: "系统配置.生态环境主管部门名称"
    required: true

  - id: "案由"
    key: "{{案由}}"
    type: "string"
    source: "案件数据.案由"
    required: true

  - id: "当事人名称"
    key: "{{当事人名称}}"
    type: "string"
    source: "案件数据.当事人.名称"
    required: true

  - id: "陈述申辩主要意见"
    key: "{{陈述申辩主要意见}}"
    type: "text"
    source: "AI生成.从陈述申辩笔录生成摘要"
    required: true

  - id: "复核意见"
    key: "{{复核意见}}"
    type: "text"
    source: "用户输入"
    required: true

  - id: "复核结论"
    key: "{{复核结论}}"
    type: "select"
    source: "用户输入"
    required: true
    options:
      - "采纳"
      - "部分采纳"
      - "不予采纳"

  - id: "复核人签字"
    key: "{{复核人签字}}"
    type: "string"
    source: "系统数据.当前用户"
    required: true

  - id: "复核日期"
    key: "{{复核日期}}"
    type: "date"
    source: "系统数据.当前日期"
    required: true
