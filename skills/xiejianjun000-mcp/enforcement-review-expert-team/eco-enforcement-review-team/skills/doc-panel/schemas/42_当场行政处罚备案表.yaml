id: "42"
name: "当场行政处罚备案表"
category: "行政处罚-简易程序"
complexity: "low"
template: "42_当场行政处罚备案表.md"
description: "生态环境主管部门对当场作出的行政处罚决定进行备案的内部文书"

fields:
  - id: "部门名称"
    key: "{{部门名称}}"
    type: "string"
    source: "系统配置.生态环境主管部门名称"
    required: true

  - id: "当事人名称"
    key: "{{当事人名称}}"
    type: "string"
    source: "案件数据.当事人.名称"
    required: true

  - id: "案由"
    key: "{{案由}}"
    type: "string"
    source: "案件数据.案由"
    required: true

  - id: "处罚决定书编号"
    key: "{{处罚决定书编号}}"
    type: "string"
    source: "案件数据.处罚决定书编号"
    required: true

  - id: "处罚内容"
    key: "{{处罚内容}}"
    type: "text"
    source: "AI生成.从处罚决定生成摘要"
    required: true

  - id: "执法人员签字"
    key: "{{执法人员签字}}"
    type: "string"
    source: "系统数据.当前用户"
    required: true

  - id: "执法证号"
    key: "{{执法证号}}"
    type: "string"
    source: "系统数据.当前用户"
    required: true

  - id: "备案日期"
    key: "{{备案日期}}"
    type: "date"
    source: "系统数据.当前日期"
    required: true

  - id: "接收人签字"
    key: "{{接收人签字}}"
    type: "string"
    source: "用户输入"
    required: true
