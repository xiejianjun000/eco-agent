id: "61"
name: "行政处罚案件结案审批表"
category: "行政处罚-结案归档"
complexity: "low"
template: "61_行政处罚案件结案审批表.md"
description: "生态环境主管部门对行政处罚案件进行结案的内部审批文书"

fields:
  - id: "部门名称"
    key: "{{部门名称}}"
    type: "string"
    source: "系统配置.生态环境主管部门名称"
    required: true

  - id: "案由"
    key: "{{案由}}"
    type: "string"
    source: "案件数据.案由"
    required: true

  - id: "当事人名称"
    key: "{{当事人名称}}"
    type: "string"
    source: "案件数据.当事人.名称"
    required: true

  - id: "处罚决定书编号"
    key: "{{处罚决定书编号}}"
    type: "string"
    source: "案件数据.处罚决定书编号"
    required: true

  - id: "执行情况"
    key: "{{执行情况}}"
    type: "text"
    source: "AI生成.从执行记录生成"
    required: true

  - id: "结案理由"
    key: "{{结案理由}}"
    type: "text"
    source: "AI生成.从案件信息生成结案理由"
    required: true

  - id: "承办人意见"
    key: "{{承办人意见}}"
    type: "text"
    source: "用户输入"
    required: true

  - id: "承办人签字"
    key: "{{承办人签字}}"
    type: "string"
    source: "系统数据.当前用户"
    required: true

  - id: "承办人日期"
    key: "{{承办人日期}}"
    type: "date"
    source: "系统数据.当前日期"
    required: true

  - id: "审批人意见"
    key: "{{审批人意见}}"
    type: "select"
    source: "用户输入"
    required: true
    options:
      - "同意结案"
      - "不同意结案"

  - id: "审批人签字"
    key: "{{审批人签字}}"
    type: "string"
    source: "用户输入"
    required: true

  - id: "审批日期"
    key: "{{审批日期}}"
    type: "date"
    source: "用户输入"
    required: true
