id: "71"
name: "解除查封/扣押决定书"
category: "行政强制"
complexity: "medium"
template: "71_解除查封扣押决定书.md"
description: "生态环境主管部门决定解除查封或扣押措施的文书"

fields:
  - id: "部门名称"
    key: "{{部门名称}}"
    type: "string"
    source: "系统配置.生态环境主管部门名称"
    required: true

  - id: "文号"
    key: "{{文号}}"
    type: "string"
    source: "系统数据.生成文号"
    required: true

  - id: "当事人名称"
    key: "{{当事人名称}}"
    type: "string"
    source: "案件数据.当事人.名称"
    required: true

  - id: "原查封扣押决定书编号"
    key: "{{原查封扣押决定书编号}}"
    type: "string"
    source: "案件数据.查封扣押.决定书编号"
    required: true

  - id: "原查封扣押日期"
    key: "{{原查封扣押日期}}"
    type: "date"
    source: "案件数据.查封扣押.日期"
    required: true

  - id: "查封扣押物品"
    key: "{{查封扣押物品}}"
    type: "text"
    source: "案件数据.查封扣押.物品清单"
    required: true

  - id: "解除理由"
    key: "{{解除理由}}"
    type: "text"
    source: "AI生成.从案件情况生成解除理由"
    required: true

  - id: "解除日期"
    key: "{{解除日期}}"
    type: "date"
    source: "系统数据.当前日期"
    required: true

  - id: "法律依据"
    key: "{{法律依据}}"
    type: "text"
    source: "AI生成.生成解除法律依据"
    required: true

  - id: "决定日期"
    key: "{{决定日期}}"
    type: "date"
    source: "系统数据.当前日期"
    required: true
