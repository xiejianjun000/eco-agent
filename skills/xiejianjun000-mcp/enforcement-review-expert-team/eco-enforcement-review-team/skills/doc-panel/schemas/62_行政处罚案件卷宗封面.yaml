id: "62"
name: "行政处罚案件卷宗封面"
category: "行政处罚-结案归档"
complexity: "low"
template: "62_行政处罚案件卷宗封面.md"
description: "行政处罚案件卷宗的封面信息"

fields:
  - id: "部门名称"
    key: "{{部门名称}}"
    type: "string"
    source: "系统配置.生态环境主管部门名称"
    required: true

  - id: "案由"
    key: "{{案由}}"
    type: "string"
    source: "案件数据.案由"
    required: true

  - id: "当事人名称"
    key: "{{当事人名称}}"
    type: "string"
    source: "案件数据.当事人.名称"
    required: true

  - id: "处罚决定书编号"
    key: "{{处罚决定书编号}}"
    type: "string"
    source: "案件数据.处罚决定书编号"
    required: false

  - id: "卷宗号"
    key: "{{卷宗号}}"
    type: "string"
    source: "系统数据.生成编号"
    required: true

  - id: "经办人"
    key: "{{经办人}}"
    type: "string"
    source: "系统数据.当前用户"
    required: true

  - id: "立卷日期"
    key: "{{立卷日期}}"
    type: "date"
    source: "系统数据.当前日期"
    required: true

  - id: "保管期限"
    key: "{{保管期限}}"
    type: "select"
    source: "用户输入"
    required: true
    options:
      - "永久"
      - "30年"
      - "10年"

  - id: "归档号"
    key: "{{归档号}}"
    type: "string"
    source: "系统数据.生成编号"
    required: false
