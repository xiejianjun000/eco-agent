id: "31"
name: "陈述申辩意见笔录"
category: "行政处罚-告知和听证"
complexity: "medium"
template: "31_陈述申辩意见笔录.md"
description: "记录当事人对拟作出的行政处罚进行陈述和申辩的文书"

fields:
  - id: "部门名称"
    key: "{{部门名称}}"
    type: "string"
    source: "系统配置.生态环境主管部门名称"
    required: true

  - id: "时间起止"
    key: "{{时间起止}}"
    type: "string"
    source: "系统数据.当前日期"
    required: true

  - id: "地点"
    key: "{{地点}}"
    type: "string"
    source: "用户输入"
    required: true

  - id: "陈述申辩人名称"
    key: "{{陈述申辩人名称}}"
    type: "string"
    source: "案件数据.当事人.名称"
    required: true

  - id: "陈述申辩人身份信息"
    key: "{{陈述申辩人身份信息}}"
    type: "string"
    source: "案件数据.当事人.证件号码"
    required: false

  - id: "承办人信息"
    key: "{{承办人信息}}"
    type: "string"
    source: "系统数据.当前用户"
    required: true

  - id: "记录人"
    key: "{{记录人}}"
    type: "string"
    source: "系统数据.当前用户"
    required: true

  - id: "告知事项记录"
    key: "{{告知事项记录}}"
    type: "text"
    source: "用户输入"
    required: true

  - id: "陈述申辩内容"
    key: "{{陈述申辩内容}}"
    type: "text"
    source: "AI生成.从陈述申辩记录生成整理内容"
    required: true

  - id: "陈述申辩人确认意见"
    key: "{{陈述申辩人确认意见}}"
    type: "text"
    source: "用户输入"
    required: true

  - id: "陈述申辩人签字"
    key: "{{陈述申辩人签字}}"
    type: "string"
    source: "用户输入"
    required: true

  - id: "承办人签字"
    key: "{{承办人签字}}"
    type: "string"
    source: "系统数据.当前用户"
    required: true

  - id: "记录人签字"
    key: "{{记录人签字}}"
    type: "string"
    source: "系统数据.当前用户"
    required: true

  - id: "日期"
    key: "{{日期}}"
    type: "date"
    source: "系统数据.当前日期"
    required: true
