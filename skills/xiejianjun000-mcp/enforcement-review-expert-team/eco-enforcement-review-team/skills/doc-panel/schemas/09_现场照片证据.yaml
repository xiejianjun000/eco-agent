id: "09"
name: "现场照片（图片、影像资料）证据"
category: "行政处罚-调查取证"
complexity: "low"
template: "09_现场照片证据.md"
description: "生态环境执法现场照片、影像资料证据的记录文书"

fields:
  - id: "部门名称"
    key: "{{部门名称}}"
    type: "string"
    source: "系统配置.生态环境主管部门名称"
    required: true

  - id: "证明对象"
    key: "{{证明对象}}"
    type: "text"
    source: "用户输入"
    required: true
    description: "拍摄内容和证明目的"

  - id: "拍摄时间"
    key: "{{拍摄时间}}"
    type: "date"
    source: "系统数据.当前日期"
    required: true

  - id: "拍摄地点"
    key: "{{拍摄地点}}"
    type: "string"
    source: "案件数据.现场地址"
    required: true

  - id: "拍摄人"
    key: "{{拍摄人}}"
    type: "string"
    source: "系统数据.当前用户"
    required: true

  - id: "当事人见证人确认意见"
    key: "{{当事人见证人确认意见}}"
    type: "text"
    source: "用户输入"
    required: false

  - id: "当事人见证人签字日期"
    key: "{{当事人见证人签字日期}}"
    type: "date"
    source: "用户输入"
    required: false

  - id: "执法人员签字"
    key: "{{执法人员签字}}"
    type: "string"
    source: "系统数据.当前用户"
    required: true
