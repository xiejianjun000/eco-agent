id: "55"
name: "涉嫌环境犯罪案件移送书"
category: "行政处罚-移送"
complexity: "medium"
template: "55_涉嫌环境犯罪案件移送书.md"
description: "生态环境主管部门向公安机关移送涉嫌环境犯罪案件的文书"

fields:
  - id: "部门名称"
    key: "{{部门名称}}"
    type: "string"
    source: "系统配置.生态环境主管部门名称"
    required: true

  - id: "文号"
    key: "{{文号}}"
    type: "string"
    source: "系统数据.生成文号"
    required: true

  - id: "移送公安机关"
    key: "{{移送公安机关}}"
    type: "string"
    source: "用户输入"
    required: true

  - id: "当事人名称"
    key: "{{当事人名称}}"
    type: "string"
    source: "案件数据.当事人.名称"
    required: true

  - id: "当事人身份信息"
    key: "{{当事人身份信息}}"
    type: "string"
    source: "案件数据.当事人.证件号码"
    required: true

  - id: "当事人地址"
    key: "{{当事人地址}}"
    type: "string"
    source: "案件数据.当事人.地址"
    required: true

  - id: "案由"
    key: "{{案由}}"
    type: "string"
    source: "案件数据.案由"
    required: true

  - id: "涉嫌犯罪事实"
    key: "{{涉嫌犯罪事实}}"
    type: "text"
    source: "AI生成.从调查记录生成"
    required: true

  - id: "涉嫌罪名及刑法依据"
    key: "{{涉嫌罪名及刑法依据}}"
    type: "text"
    source: "AI生成.从案件事实匹配刑法条款"
    required: true

  - id: "移送依据"
    key: "{{移送依据}}"
    type: "text"
    source: "AI生成.生成移送法律依据"
    required: true

  - id: "移送材料清单"
    key: "{{移送材料清单}}"
    type: "text"
    source: "AI生成.从案件材料生成清单"
    required: true

  - id: "联系人"
    key: "{{联系人}}"
    type: "string"
    source: "系统数据.当前用户"
    required: true

  - id: "联系电话"
    key: "{{联系电话}}"
    type: "string"
    source: "系统数据.当前用户"
    required: true

  - id: "决定日期"
    key: "{{决定日期}}"
    type: "date"
    source: "系统数据.当前日期"
    required: true
