id: "20"
name: "监测/检测/鉴定结果告知书"
category: "行政处罚-调查取证"
complexity: "medium"
template: "20_监测检测鉴定结果告知书.md"
description: "生态环境主管部门将委托监测、检测或鉴定结果告知当事人的文书"

fields:
  - id: "部门名称"
    key: "{{部门名称}}"
    type: "string"
    source: "系统配置.生态环境主管部门名称"
    required: true

  - id: "文号"
    key: "{{文号}}"
    type: "string"
    source: "系统数据.生成文号"
    required: true

  - id: "当事人名称"
    key: "{{当事人名称}}"
    type: "string"
    source: "案件数据.当事人.名称"
    required: true

  - id: "委托事项类型"
    key: "{{委托事项类型}}"
    type: "select"
    source: "案件数据.委托.类型"
    required: true
    options:
      - "监测"
      - "检测"
      - "鉴定"

  - id: "委托机构名称"
    key: "{{委托机构名称}}"
    type: "string"
    source: "案件数据.委托.机构名称"
    required: true

  - id: "监测检测鉴定结论"
    key: "{{监测检测鉴定结论}}"
    type: "text"
    source: "AI生成.从监测检测鉴定报告生成结论摘要"
    required: true

  - id: "附件材料"
    key: "{{附件材料}}"
    type: "text"
    source: "用户输入"
    required: false

  - id: "当事人确认意见"
    key: "{{当事人确认意见}}"
    type: "text"
    source: "用户输入"
    required: false

  - id: "决定日期"
    key: "{{决定日期}}"
    type: "date"
    source: "系统数据.当前日期"
    required: true
