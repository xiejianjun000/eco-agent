id: "10"
name: "调查询问笔录"
category: "行政处罚-调查取证"
complexity: "medium"
template: "10_调查询问笔录.md"
description: "执法人员对违法嫌疑人、污染受害人、证人等人员进行询问调查的详细记录文书"

fields:
  - id: "部门名称"
    key: "{{部门名称}}"
    type: "string"
    source: "系统配置.生态环境主管部门名称"
    required: true

  - id: "询问开始时间"
    key: "{{询问开始时间}}"
    type: "datetime"
    source: "案件数据.调查询问.开始时间"
    required: true
    description: "格式：年月日时分"

  - id: "询问结束时间"
    key: "{{询问结束时间}}"
    type: "datetime"
    source: "案件数据.调查询问.结束时间"
    required: true
    description: "格式：年月日时分"

  - id: "询问地点"
    key: "{{询问地点}}"
    type: "string"
    source: "案件数据.调查询问.地点"
    required: true

  - id: "被询问人姓名"
    key: "{{被询问人姓名}}"
    type: "string"
    source: "案件数据.调查询问.被询问人.姓名"
    required: true

  - id: "被询问人性别"
    key: "{{被询问人性别}}"
    type: "enum"
    source: "案件数据.调查询问.被询问人.性别"
    required: true
    options:
      - "男"
      - "女"

  - id: "被询问人年龄"
    key: "{{被询问人年龄}}"
    type: "number"
    source: "案件数据.调查询问.被询问人.年龄"
    required: true

  - id: "被询问人身份证件号码"
    key: "{{被询问人身份证件号码}}"
    type: "string"
    source: "案件数据.调查询问.被询问人.身份证件号码"
    required: true

  - id: "被询问人工作单位"
    key: "{{被询问人工作单位}}"
    type: "string"
    source: "案件数据.调查询问.被询问人.工作单位"
    required: false

  - id: "被询问人职务"
    key: "{{被询问人职务}}"
    type: "string"
    source: "案件数据.调查询问.被询问人.职务"
    required: false

  - id: "被询问人电话"
    key: "{{被询问人电话}}"
    type: "string"
    source: "案件数据.调查询问.被询问人.电话"
    required: false

  - id: "被询问人与本案关系"
    key: "{{被询问人与本案关系}}"
    type: "string"
    source: "用户输入"
    required: true
    description: "如违法嫌疑单位的工作人员、污染受害人、证人等"
    options:
      - "违法嫌疑单位的工作人员"
      - "污染受害人"
      - "证人"
      - "其他"

  - id: "被询问人住址"
    key: "{{被询问人住址}}"
    type: "string"
    source: "案件数据.调查询问.被询问人.住址"
    required: false

  - id: "被询问人邮编"
    key: "{{被询问人邮编}}"
    type: "string"
    source: "案件数据.调查询问.被询问人.邮编"
    required: false

  - id: "调查询问人一姓名"
    key: "{{调查询问人一姓名}}"
    type: "string"
    source: "系统数据.执法人员1"
    required: true

  - id: "调查询问人一执法证编号"
    key: "{{调查询问人一执法证编号}}"
    type: "string"
    source: "系统数据.执法人员1.执法证编号"
    required: true

  - id: "调查询问人二姓名"
    key: "{{调查询问人二姓名}}"
    type: "string"
    source: "系统数据.执法人员2"
    required: true

  - id: "调查询问人二执法证编号"
    key: "{{调查询问人二执法证编号}}"
    type: "string"
    source: "系统数据.执法人员2.执法证编号"
    required: true

  - id: "记录人姓名"
    key: "{{记录人姓名}}"
    type: "string"
    source: "系统数据.记录人"
    required: true

  - id: "记录人工作单位"
    key: "{{记录人工作单位}}"
    type: "string"
    source: "系统数据.记录人.工作单位"
    required: true

  - id: "执法人员表明身份记录"
    key: "{{执法人员表明身份记录}}"
    type: "text"
    source: "AI生成.从执法人员信息和案由生成"
    required: true
    constraints:
      - "包含出示执法证件的记录和执法人员姓名及执法证号"
      - "包含被调查询问人已确认的声明"
      - "包含申请回避权利告知和配合调查义务告知"
      - "包含被调查询问人是否申请回避的确认"

  - id: "询问内容"
    key: "{{询问内容}}"
    type: "text"
    source: "AI生成.从案件事实和调查需要生成问答内容"
    required: true
    constraints:
      - "包括建设、生产情况（项目性质、生产工艺、生产设备、原辅材料、产品等）"
      - "包括环保相关手续（环评审批、竣工验收、排污许可证等）"
      - "包括污染物产生情况和污染处理设施建设运行情况"
      - "包括违法情况（违法行为确认、主观过错、违法持续时间、违法次数等）"
      - "包括需要告知和调查的其他情况"
      - "每份笔录只对应一个被调查询问人"
      - "以问答形式记录，区分问和答"

  - id: "被询问人确认意见"
    key: "{{被询问人确认意见}}"
    type: "text"
    source: "用户输入"
    required: true
    description: "参考语句：以上笔录已阅无误，记录属实。拒不审阅确认的注明情况"

  - id: "被询问人签字"
    key: "{{被询问人签字}}"
    type: "string"
    source: "用户输入"
    required: true

  - id: "被询问人签字日期"
    key: "{{被询问人签字日期}}"
    type: "date"
    source: "系统数据.当前日期"
    required: true

  - id: "调查询问人一签字"
    key: "{{调查询问人一签字}}"
    type: "string"
    source: "系统数据.执法人员1"
    required: true

  - id: "调查询问人二签字"
    key: "{{调查询问人二签字}}"
    type: "string"
    source: "系统数据.执法人员2"
    required: true

  - id: "调查询问人签字日期"
    key: "{{调查询问人签字日期}}"
    type: "date"
    source: "系统数据.当前日期"
    required: true

  - id: "记录人签字"
    key: "{{记录人签字}}"
    type: "string"
    source: "系统数据.记录人"
    required: true

  - id: "记录人签字日期"
    key: "{{记录人签字日期}}"
    type: "date"
    source: "系统数据.当前日期"
    required: true

  - id: "参加人签字"
    key: "{{参加人签字}}"
    type: "string"
    source: "用户输入"
    required: false

  - id: "参加人签字日期"
    key: "{{参加人签字日期}}"
    type: "date"
    source: "用户输入"
    required: false

  - id: "页码信息"
    key: "{{页码信息}}"
    type: "string"
    source: "系统数据.自动编号"
    required: true
    description: "第X页，共X页"

  - id: "是否申请回避"
    key: "{{是否申请回避}}"
    type: "enum"
    source: "用户输入"
    required: true
    options:
      - "不申请回避"
      - "申请回避"

branches:
  - id: "回避申请段"
    field: "{{回避申请段}}"
    conditions:
      - if: "是否申请回避=不申请回避"
        select: "branch_no_recusal"
      - if: "是否申请回避=申请回避"
        select: "branch_recusal"
