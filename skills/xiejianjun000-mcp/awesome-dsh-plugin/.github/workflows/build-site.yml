name: Build site from README

on:
  push:
    branches: [main]
    paths: ['README.md', 'README.en.md', 'scripts/build-site.mjs', 'scripts/probe-npm.mjs', 'scripts/probe-stars.mjs', 'site/template.html', 'site/locales.mjs']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe npm packages + GitHub stars
        run: |
          node scripts/probe-npm.mjs
          node scripts/probe-stars.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build site rows from READMEs
        run: node scripts/build-site.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs README.md README.en.md data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: rebuild site from README"
          git push
