# eco.cordis.yml — 组合装配（对标 DSH cordis.yml）
# 每条目 = 一个插件：plugin 模块/类路径 + 可选 config/inject。
# 加新能力 = 新插件文件 + 本文件一行，不动 server/chat.py。

- plugin: agent_core.cordis_plugins.subagent_cleaner
  config: { ttl_seconds: 1800, interval_seconds: 300 }
  inject: [subagents]

- plugin: agent_core.cordis_plugins.audit_panel
  inject: [slots, trace_audit]

# 政务平台工具集：一切皆插件——工具注册也走组合装配（与 chat 幂等共存）
- plugin: agent_core.cordis_plugins.govmcp_tools_loader

# 内置能力工具集（法典检索/腾讯文档上云）：handler 注册进工具注册表
- plugin: agent_core.cordis_plugins.builtin_tools

# 内置 Cron 定时调度：自然语言→cron→后台线程调度（通电 scheduler.py）
- plugin: agent_core.cordis_plugins.cron_scheduler

# 自主技能孵化：同类工具组合 ≥3 次 → AutoLearnEngine 提炼为 Skill（通电 skill_system.py）
- plugin: agent_core.cordis_plugins.skill_hatcher
  config: { hatch_threshold: 3, min_tools: 3 }

# 多平台网关：按已配凭证自动拉起飞书/企业微信/钉钉 webhook 子进程
- plugin: agent_core.cordis_plugins.gateway_boot
