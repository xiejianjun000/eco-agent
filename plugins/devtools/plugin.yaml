name: devtools
version: 0.1.0
description: 通用开发执行工具集——让 ECO AGENT 具备 Bash/文件/git 操作能力（对标 DSH 的执行工具）
entry: handler
tools:
  - name: shell_run
    description: 在沙箱中执行 shell 命令并返回 stdout/stderr
    risk_level: L3
  - name: file_read
    description: 读取文本文件内容
    risk_level: L1
  - name: file_write
    description: 写入文本文件（覆盖）
    risk_level: L2
  - name: git_status
    description: 查看 git 仓库状态
    risk_level: L1
permissions:
  shell_run: L3
  file_read: L1
  file_write: L2
  git_status: L1
