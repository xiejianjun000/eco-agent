name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install ruff
      - name: Lint check
        run: |
          ruff check --output-format=github . --ignore E402,F401
          echo "::notice::Lint passed"

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install pytest pytest-xdist pytest-cov
      - name: Run tests (parallel)
        run: |
          python -m pytest tests/modules/ -v -n auto --tb=short --junit-xml=test-results.xml
      - name: Generate test report
        run: |
          python tests/run_all.py --report-only || true
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: tests/reports/
      - name: Update README badges
        run: |
          TOTAL=$(python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('test-results.xml').getroot(); s=r.get('tests','0'); f=r.get('failures','0'); e=r.get('errors','0'); print(int(s)-int(f)-int(e))")
          echo "Passed: $TOTAL"
          # Badge is updated by the runner script

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gh release create "${{ github.ref_name }}" \
            --repo="${{ github.repository }}" \
            --title="Eco Agent ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
