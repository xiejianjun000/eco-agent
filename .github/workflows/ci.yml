name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip python3-venv
      - name: Install dependencies
        run: |
          python3 -m pip install --quiet -r requirements.txt pytest-xdist ruff
      - name: Lint check
        run: |
          ruff check . --output-format=github
      - name: Run tests (parallel)
        run: |
          python3 -m pytest tests/modules/ -v -n auto --tb=short
      - name: Generate report
        run: |
          python3 tests/run_all.py --report-only || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: tests/reports/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo="${{ github.repository }}" \
            --title="Eco Agent ${{ github.ref_name }}" \
            --generate-notes
