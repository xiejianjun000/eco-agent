global:
  scrape_interval: 15s

scrape_configs:
  # OTel Collector 转发的 OTLP metrics（Jaeger/应用 OTLP 推送路径）
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # eco Agent 应用自身暴露的 /metrics（HTTP 请求/LLM/业务指标）
  # host.docker.internal：观测栈容器访问宿主机上的 eco server（8321）。
  # docker-compose 已通过 extra_hosts 将 host.docker.internal 映射到 host-gateway，
  # macOS / Windows / Linux 均可解析。
  - job_name: eco
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:8321"]
