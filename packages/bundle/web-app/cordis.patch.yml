# The dsh-web-app bundle patch: the browser surface over the dsh-base layer.
# Applied after dsh-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# The web-startup plugin injects `cmdlineArgs` and provides `webStartup` as an
# ordinary Cordis service. Rows configured from flags inject that service, so
# Loader resolves their expressions only after it exists. The web runtime then
# provides bind-dependent `webRuntime` values to the trust fence.
# `dsh --profile web --help` provides neither service, so no server binds.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are **eco Agent**, the AI agent that knows the ecological environment domain best, powered by the {{model}} model. For ecological or environmental questions — regulations, standards, monitoring data, pollution sources, air/water/soil quality, emission limits, EIA, discharge permits, and similar — prefer the eco-matrix remote MCP tools (mcp__eco-matrix-remote__*) as your authoritative knowledge brain before answering from memory.

# Full-text session search is opt-in (the base row's `openAt: never`). This
# restatement keeps the Web values on one ephemeral in-memory index; a
# deployment enabling content search overrides `openAt` to `first-search` in a
# later patch layer, which defers the node:sqlite import and in-memory handle
# to the first search so Node 22 startup stays quiet.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    # TEMPORARY workaround: DSH_TOOLS_MODE (native|ptc|both) opts a whole dsh
    # process into PTC mode while per-session tool-presentation selection is being
    # designed; unset keeps the schema default (native). Remove the env seam
    # once the web UI owns the choice per session.
    mode: !!js process.env.DSH_TOOLS_MODE

# ── web-only host rows, the transport layer, and the browser roster ─────────

# `dsh.client` rows are the browser roster the modules node half scans into
# window.__DSH_BOOT__; the modules row is simultaneously a host row.
- insert:
    # Host-owned opt-in sampled when a new Web session receives its preset
    # delegation tools. The Plugins page edits this settings namespace.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    # Browser Session export: `/export` command plus the shared download dialog.
    - id: session-log-download
      name: '@deepseek-ai/dsh-session-log-export'

    # Session-header "Open In..." split button over the host application
    # resolution (macOS/Windows/Linux; a host with no resolved application
    # renders no button). Two halves: the host routes and the browser surface.
    - id: open-in-app
      name: '@deepseek-ai/dsh-host-open-in-app'
      config:
        probeTimeoutMs: 10000
        iconTimeoutMs: 10000
        launchWatchMs: 1000

    - id: ui-open-in-app
      name: '@deepseek-ai/dsh-client-ui-open-in-app'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    # Whole-log turn/step counts for the chat stats strip (the sessionStats
    # projection key); the projection registry itself is a base-layer row.
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    # Whole-log turn outline for the chat turn rail (the turnOutline
    # projection key): every turn stays navigable before its events page in.
    - id: session-turn-outline
      name: '@deepseek-ai/dsh-session-turn-outline'

    # Resolve bind host, SSH launch, and display once at boot, then mount the
    # matching dual-face directory picker. Mount -native or -browse directly in
    # an overlay to pin the interaction.
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

    # Read-only projection of current Loader entries for trusted client RPCs.
    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    # Session commands, cold reads, and live control over Typert Remote.
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    # Workspace file service: bounded read, directory listing, and the
    # agent-write change feed inside the session workspace root.
    - id: terminal-controller
      name: '@deepseek-ai/dsh-api-terminal-controller'
    - id: workspace-files
      name: '@deepseek-ai/dsh-api-workspace-files'

    # Configuration-surface reads and writes over Typert Remote. Each method
    # reports an actionable error when its settings-domain provider is absent.
    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'

    # Workspace commands and reconnect-safe projection over Typert Remote.
    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # eco Agent 微信助手：个人微信 → eco Agent 桥接（腾讯 iLink 协议，扫码登录 + 白名单）。
    - id: wechat-bridge
      name: '@deepseek-ai/dsh-im-eco-wechat'

    # eco Agent 生态环境知识大脑：远程 eco-matrix MCP（生态环境专业知识库）。
    # 固化为默认远程 MCP，开机即注入。
    #
    # 行 id 刻意与 `serverName` 同名（都是 eco-matrix-remote）：设置页的
    # 「MCP 服务」列的是 Loader 行 id，工具命名空间是 mcp__<serverName>__*，
    # 三者对上号才不会让人以为本机还跑着一个 stdio 版的 eco-matrix。
    # 本行是**远程** streamable-http，不是本机进程：本机不 spawn 任何 MCP
    # 服务端，工具调用全部走 http://124.223.58.55/eco/mcp。
    # 注意：`X-API-Key` 取不到时 headers 里会出现 undefined，schema 校验直接
    # 拒掉整行（表现为「1 entry did not activate」+ 设置页显示启动失败），
    # 所以自部署必须先设好 ECO_MATRIX_API_KEY（见仓库 .env）。
    - id: eco-matrix-remote
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: eco-matrix-remote
        transport: streamable-http
        url: http://124.223.58.55/eco/mcp
        headers:
          X-API-Key: !!js process.env.ECO_MATRIX_API_KEY
        failOnStartupError: false

    # eco Agent 飞书助手：飞书长连接 → eco Agent 桥接（持久会话 + 流式卡片 + 主动推送）。
    # TODO(飞书适配): 社区插件基于旧版 dsh API（settingsNamespace/ctx.agent/事件名已变），适配前暂不加载。
    - id: feishu-gateway
      name: '@deepseek-ai/dsh-im-eco-feishu'
      disabled: true

    # Ordinary provider for the parsed Web flags. Its plugin-level injection
    # waits for cmdlineArgs; no launcher metadata or special row kind is needed.
    - id: web-startup
      name: '@deepseek-ai/dsh-web-app/startup'

    # ── layer 2: transport/service ──────────────────────────────────────────────

    # Plain route-registration carrier; host and port come from the app's
    # webStartup provider, with these deployment fallbacks. The dist is served by
    # the web-runtime row below through the fallback seat.
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 8088
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    # Web glue owned by this bundle: resolves the built frontend dist (an
    # assembly fact of dsh-web-app, never user config), mounts the
    # frontend-static fallback owner, registers the web-surface prompt
    # section and the bash runtime variable, prints the URL line, and opens the
    # canonical local URL after the full Loader tree settles and the required-
    # entry audit passes. The
    # webStartup provider supplies invocation-only values; after the server binds, this row samples
    # LAN trust once and provides `webRuntime`. A complete agent-preset persona
    # suppresses the prompt section for that agent while retaining the host-owned
    # shell variable.
    - id: web-runtime
      name: '@deepseek-ai/dsh-web-app'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        surfaceContext: true
        trustedHosts: !!js ctx.webStartup.trustedHosts

    # The client-plugin reload chain, always mounted: it is idle until a
    # rebuild watcher (pnpm run dev:web) actually rewrites client bundles. It
    # is a row rather than a child of web-runtime because its node half is a
    # client-side package, which a host-side bundle cannot import.
    - id: client-hmr
      name: '@deepseek-ai/dsh-client-hmr'

    # ── browser plugin roster (dsh.client rows; node halves are layer-2 hosts) ──

    # Dual-face: the node half scans this tree, composes window.__DSH_BOOT__,
    # and serves /plugins/<id>/client.js; the browser half is the module table
    # the shell kernel constructs before cordis exists (adopted as a plugin
    # entry by the kernel, never fetched).
    - id: modules
      name: '@deepseek-ai/dsh-client-modules'

    # Owns both ends of the web transport: node half binds the gateway to the
    # webserver under /api; browser half is the fetch/SSE client.
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      inject: [webRuntime]
      config:
        # LAN literals derived from the active bind plus --trusted-host extras.
        # A deployment adding authorities keeps this expression and concatenates
        # its literals, for example: ['app.internal', ...ctx.webRuntime.trustedHosts].
        trustedHosts: !!js ctx.webRuntime.trustedHosts

    # Raw Blob and ReadableStream uploads run independently of Connection's
    # RPC and generation service.
    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    - id: cordis-client-runner
      name: '@deepseek-ai/dsh-cordis-client-runner'

    - id: ui-theme
      name: '@deepseek-ai/dsh-client-ui-theme'

    - id: locale
      name: '@deepseek-ai/dsh-client-locale'

    - id: ui-layout
      name: '@deepseek-ai/dsh-client-ui-layout'

    - id: ui-renderer
      name: '@deepseek-ai/dsh-client-ui-renderer'

    - id: ui-session
      name: '@deepseek-ai/dsh-client-ui-session'

    # Unified resource model: protocol providers behind the useResource hook.
    - id: resources
      name: '@deepseek-ai/dsh-client-resources'

    - id: ui-sidebar
      name: '@deepseek-ai/dsh-client-ui-sidebar'

    # The right Sidebar: one docking surface per session over ui-dockkit.
    - id: ui-sidebar-right
      name: '@deepseek-ai/dsh-client-ui-sidebar-right'


    - id: office-to-pdf
      name: '@deepseek-ai/dsh-office-to-pdf'

    # The right Sidebar's document tab: bounded file reads with selectable
    # Markdown, code, HTML, PDF, Office, and plain-text renderers.
    - id: ui-sidebar-documentpreview
      name: '@deepseek-ai/dsh-client-ui-sidebar-documentpreview'

    # eco 媒体预览：视频 / 音频文件在文档预览器里直接播放（注册为扩展名
    # 渲染器，拔掉这一行就退回纯文本视图）。
    - id: ui-sidebar-eco-media
      name: '@deepseek-ai/dsh-client-ui-sidebar-eco-media'

    # eco tab 内容动作：右侧栏 tab 菜单里补「复制文件路径 / 复制文件名 /
    # 在文件管理器中显示」，只对工作区文件 tab 出现。
    - id: ui-sidebar-eco-tabactions
      name: '@deepseek-ai/dsh-client-ui-sidebar-eco-tabactions'

    # Sandboxed HTTP(S) Browser tabs, including loopback targets.
    - id: ui-sidebar-browser
      name: '@deepseek-ai/dsh-client-ui-sidebar-browser'

    - id: ui-sidebar-terminal
      name: '@deepseek-ai/dsh-client-ui-sidebar-terminal'
    # The right Sidebar's workspace file tree tab type.
    - id: ui-sidebar-files
      name: '@deepseek-ai/dsh-client-ui-sidebar-files'

    - id: ui-settings
      name: '@deepseek-ai/dsh-client-ui-settings'

    - id: ui-settings-general
      name: '@deepseek-ai/dsh-client-ui-settings-general'

    - id: ui-settings-models
      name: '@deepseek-ai/dsh-client-ui-settings-models'

    # ── eco Agent 设置分区：一个分区 = 一个独立插件包，可插可拔 ───────────
    # 拔掉某个分区 = 给它的行加 `disabled: true`（或整行删掉）；插上 = 去掉。
    # 顺序由各包注入时声明的 order 决定：
    #   0 通用 · 10 模型 · 12 记忆                      ← agent 的"脑"
    #   15 内置插件 · 20 Agent 预设                      ← 能力组装
    #   22 MCP 服务 · 23 渠道接入                        ← 外部接入
    #   24 权限与审批 · 25 已归档会话                    ← 安全与数据
    #   40 数据与诊断 · 45 帮助与关于 · 50 账号与身份（默认关闭）
    # 排序只由各包注入时声明的 order 决定，这里的文件顺序无关。上游占位
    # 0/10/15/20/25 是固定的，eco 包一律取中间值（12/22/23/24），避免同值
    # 撞车 —— 同 order 的相对次序由装载顺序决定，重启可能变。

    # MCP 服务：远程 MCP 的真实连通状态（读宿主 pluginInventory，不画假绿点）。
    - id: ui-settings-eco-mcp
      name: '@deepseek-ai/dsh-client-ui-settings-eco-mcp'

    # 权限与审批：新会话默认权限预设（宿主 permission namespace）。
    - id: ui-settings-eco-permission
      name: '@deepseek-ai/dsh-client-ui-settings-eco-permission'

    # 记忆：宿主没有 memory namespace 时明说「没接入」，不摆假开关。
    - id: ui-settings-eco-memory
      name: '@deepseek-ai/dsh-client-ui-settings-eco-memory'

    # 渠道接入：微信 / 飞书助手的配置入口。
    - id: ui-settings-eco-assistants
      name: '@deepseek-ai/dsh-client-ui-settings-eco-assistants'

    # 数据与诊断：插件健康统计 + 浏览器模块加载结果 + 日志导出入口说明。
    - id: ui-settings-eco-diagnostics
      name: '@deepseek-ai/dsh-client-ui-settings-eco-diagnostics'

    # 帮助与关于：开源版必备 —— 是什么、源码在哪、问题往哪提。
    - id: ui-settings-eco-about
      name: '@deepseek-ai/dsh-client-ui-settings-eco-about'

    # 账号与身份（预留）：开源自部署版没有账号体系，默认关闭。
    # 正式应用版启用 = 删掉下面的 `disabled: true`，其余代码一行不用改。
    - id: ui-settings-eco-account
      name: '@deepseek-ai/dsh-client-ui-settings-eco-account'
      disabled: true

    # Plugin management: the sidebar Plugins page installs, enables, disables,
    # and removes the profile's bundles through the `pluginManager` Remote.
    # Without a profile-backed Host it reports itself unavailable.
    - id: ui-plugin-manager
      name: '@deepseek-ai/dsh-client-ui-plugin-manager'

    # Read-only Plugin list tab in the Settings Plugins section; the built-in
    # bundles the sidebar page leaves out are inspected here.
    - id: ui-settings-plugin-inventory
      name: '@deepseek-ai/dsh-client-ui-settings-plugin-inventory'

    - id: ui-settings-unarchive-sessions
      name: '@deepseek-ai/dsh-client-ui-settings-unarchive-sessions'

    - id: ui-conversation
      name: '@deepseek-ai/dsh-client-ui-conversation'

    - id: ui-eco-suggestions
      name: '@deepseek-ai/dsh-client-ui-eco-suggestions'

    # eco 引用到输入框：选中页面任意文本浮出「引用」按钮，点击以引用块写入
    # 当前会话草稿。拔掉这一行即失去该能力，输入区其余行为不变。
    - id: ui-eco-quote
      name: '@deepseek-ai/dsh-client-ui-eco-quote'

    - id: ui-approval
      name: '@deepseek-ai/dsh-client-ui-approval'

    - id: ui-chat
      name: '@deepseek-ai/dsh-client-ui-chat'

    # Official occupants for the generic sidebar and conversation brand slots.
    - id: ui-brand-official
      name: '@deepseek-ai/dsh-client-ui-brand-official'

    - id: ui-attachment
      name: '@deepseek-ai/dsh-client-ui-attachment'

    # Tool call tree, generic fallback, and keyed business Tool views.
    - id: ui-tool
      name: '@deepseek-ai/dsh-client-ui-tool'

    - id: ui-cordis
      name: '@deepseek-ai/dsh-client-ui-cordis'

    # Turn tail: the changed-files card and delivery cards under each closing
    # assistant message. Remove this entry to turn the surface off; the tail
    # hole renders empty.
    - id: ui-deliverables
      name: '@deepseek-ai/dsh-client-ui-deliverables'

    # Records each top-level turn's changed files from git working-tree
    # snapshots; the changed-files card above renders its events.
    - id: workspace-changes
      name: '@deepseek-ai/dsh-workspace-changes'


    - id: ui-workspace
      name: '@deepseek-ai/dsh-client-ui-workspace'

    # Durable workflow lifecycle as an independent Chat node after the
    # existing generic workflow tool row.
    - id: ui-workflow-run
      name: '@deepseek-ai/dsh-client-ui-workflow-run'

    # Input triggers: the '/' | '@' pipeline (ui-input-trigger), the command surface over
