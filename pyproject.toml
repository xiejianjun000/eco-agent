[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-agent"
version = "5.0.0a0"
description = "Eco Agent — 五层循环自我进化智能体"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "requests>=2.31",
    "cryptography>=42.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["agent_core", "gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
