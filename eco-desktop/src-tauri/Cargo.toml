[package]
name = "eco-desktop"
version = "0.1.0"
description = "ECO AGENT Desktop Application"
authors = ["Taiji Agent Team"]
edition = "2021"

[lib]
name = "eco_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
